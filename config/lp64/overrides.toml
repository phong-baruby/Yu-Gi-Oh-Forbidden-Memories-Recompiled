pattern = "gaddr-field-write-from-function-like-macro-argument"
reason = "Same as the override above (see its reason) -- lists[1].cursor_box."
old = "    BUILD_DECK_TRANSITION_STATE_VIEW(state)->lists[1].cursor_box = DISPLAY_OBJECT_VIEW(object);"
