[[override]]
file = "game/func_8004DC38.c"
pattern = "gaddr-field-pointer-arithmetic-operand"
reason = """
field_DD8 (GPTR(s32), model.h -- "the base of 4-byte command records")
used as a direct operand of `+`/`-` pointer arithmetic (not through a cast,
var-decl or plain-assignment transform_c_expressions already handles --
field_DD8's own immediate parent is the `+`/`-` operator itself, one level
below where those checks look). Confirmed this needs a real pointer, not
left as the gaddr integer, two ways: the header comment calls it a pointer
base, and `x = q - p->field_DD8;`'s own compiler error (q, s32 *, minus a
plain gaddr/uint32_t: ordinary integer subtraction assigned to s32 x --
contradicts int-conversion, since it should be POINTER DIFFERENCE, an
int-sized element count -- clang suggesting "dereference with *" is a red
herring from the same type confusion) only makes sense if field_DD8 is
genuinely a pointer here. Not generalized into transform_c_expressions:
the same bare-operand shape could, in a different file, legitimately mean
plain integer arithmetic on an already-correct uint32_t (ADR-05 (4)'s other
case, AiScript_Jump's family in T1.4b/c) -- no safe syntactic rule
distinguishes the two without risking a silently wrong value (pointer
arithmetic where plain-integer was meant, or vice versa) in a case this
batch has not actually seen, so each is reviewed and fixed individually.
"""
old = "lim = p->field_DD8 + e->ti;"
new = "lim = (s32 *)G2H(p->field_DD8) + e->ti;"

