old = "    BUILD_DECK_TRANSITION_STATE_VIEW(state)->lists[0].cursor_box = DISPLAY_OBJECT_VIEW(object);"
new = "    BUILD_DECK_TRANSITION_STATE_VIEW(state)->lists[0].cursor_box = H2G(object);"

